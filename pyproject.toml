[project]
name = "bub-im-bridge"
version = "0.7.5"
description = "WeChat and Feishu channel plugins for Bub framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bub>=0.4.0",
    "weixin-agent-sdk @ git+https://github.com/iodone/weixin-agent-sdk",
    "lark-oapi>=1.6.2",
]

[project.entry-points."bub"]
weixin_channel = "bub_im_bridge.weixin.plugin:WeixinPlugin"
feishu_channel = "bub_im_bridge.feishu.plugin:FeishPlugin"
gitlab_webhook = "bub_im_bridge.gitlab.plugin:GitLabWebhookPlugin"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bub_im_bridge", "src/skills"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
